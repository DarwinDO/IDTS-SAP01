_schema-version: 3.3.0
ID: idts-sap01
version: 1.0.0
description: "IDTS shared QA runtime on SAP BTP Cloud Foundry."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - node scripts/btp/pin-cf-node-engine.js
modules:
  - name: idts-sap01-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1G
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      IDTS_EMAIL_WORKER_MODE: scheduler
      IDTS_AI_ENABLED: true
      IDTS_AI_PROVIDER: vercel
      IDTS_AI_MODEL: zai/glm-4.7-flash
      IDTS_AI_EMBEDDING_MODEL: alibaba/qwen3-embedding-0.6b
      IDTS_AI_CLASSIFICATION_MODEL: openai/gpt-5.4-nano
      IDTS_AI_HANDOFF_MODEL: minimax/minimax-m2.5
      IDTS_AI_ASSIGNMENT_MODEL: zai/glm-4.7-flash
      IDTS_AI_FALLBACK_ENABLED: true
      IDTS_AI_FALLBACK_MODEL: openai/gpt-5.4-nano
      IDTS_AI_EMBEDDING_FALLBACK_MODEL: openai/text-embedding-3-small
      IDTS_AI_HANDOFF_FALLBACK_MODEL: xai/grok-4.1-fast-non-reasoning
      IDTS_AI_REQUEST_LIMIT: 4
      IDTS_AI_REQUEST_WINDOW_SECONDS: 60
      IDTS_AI_TIMEOUT_MS: 45000
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: idts-sap01-auth
      - name: idts-sap01-db
      - name: idts-sap01-destination
      - name: idts-sap01-jobscheduler
      - name: idts-sap01-external-services
      - name: idts-sap01-ai-gateway

  - name: idts-sap01-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: idts-sap01-db

  - name: idts-sap01-app-content
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: idts-sap01-ui
          artifacts:
            - bug-management-ui.zip
          target-path: app/
        - name: idts-sap01-user-admin-ui
          artifacts:
            - user-administration-ui.zip
          target-path: app/
    requires:
      - name: idts-sap01-html5-repo-host
        parameters:
          content-target: true

  - name: idts-sap01-ui
    type: html5
    path: app/bug-management-ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci --workspaces=false
        - npm run build
      supported-platforms: []

  - name: idts-sap01-user-admin-ui
    type: html5
    path: app/user-administration-ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci --workspaces=false
        - npm run build
      supported-platforms: []

  - name: idts-sap01-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      memory: 256M
      disk-quota: 256M
    properties:
      HTML5Runtime_enabled: true
      SECURE_SESSION_COOKIE: true
    build-parameters:
      builder: custom
      commands:
        - npm ci --omit=dev --workspaces=false
    requires:
      - name: idts-sap01-auth
      - name: idts-sap01-html5-repo-runtime
      - name: idts-sap01-destination
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
          strictSSL: true

resources:
  - name: idts-sap01-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: idts-sap01-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509

  - name: idts-sap01-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: idts-sap01-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: ui5
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                URL: https://ui5.sap.com/1.148.0

  - name: idts-sap01-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: idts-sap01-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: idts-sap01-jobscheduler
    type: org.cloudfoundry.managed-service
    parameters:
      service: jobscheduler
      service-plan: free
      config:
        authentication: xsuaa

  # DonHV creates/updates this private UPS before deployment. It contains the
  # existing AWS S3 and Brevo credentials; no secret is stored in this file.
  - name: idts-sap01-external-services
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: idts-sap01-external-services

  - name: idts-sap01-ai-gateway
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: idts-sap01-ai-gateway
