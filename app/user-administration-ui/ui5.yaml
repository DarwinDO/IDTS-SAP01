specVersion: "4.0"
metadata:
  name: idts.useradministrationui
type: application
framework:
  name: SAPUI5
  version: "1.148.0"
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.ui.core
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - "/test/**"
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration:
        archiveName: user-administration-ui
        relativePaths: true
        additionalFiles:
          - xs-app.json
server:
  customMiddleware:
    - name: ui5-middleware-livereload
      afterMiddleware: compression
