<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'">
  <title>Verify Your SAP Identity | IDTS</title>
  <link rel="stylesheet" href="/onboarding/onboarding.css">
</head>
<body data-onboarding-page="continue">
  <main class="onboarding-shell" aria-labelledby="page-title">
    <section class="onboarding-card">
      <p class="product-name">IDTS</p>
      <h1 id="page-title">Verify your SAP identity</h1>
      <p class="supporting-text">Preparing secure SAP sign-in. IDTS will never ask for your SAP password, OTP, passkey, or recovery code.</p>
      <div class="busy-row" role="status" aria-live="polite">
        <span class="busy-indicator" aria-hidden="true"></span>
        <span>Redirecting to SAP sign-in…</span>
      </div>
      <noscript>
        <p class="message message-error">JavaScript is required to continue securely. Open the invitation in a browser with JavaScript enabled.</p>
      </noscript>
    </section>
  </main>
  <script type="module" src="/onboarding/onboarding-page.mjs"></script>
</body>
</html>
