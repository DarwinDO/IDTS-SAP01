<!-- Entry point login độc lập: nạp UI5 controls trước, rồi login-page.js dựng form và gọi AuthService. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Sign In - IDTS</title>
  <link rel="stylesheet" href="css/login.css">
  <!-- Bootstrap chỉ sap.m/sap.f cho trang login; chưa tạo Fiori Elements/OData model. -->
  <script
    id="sap-ui-bootstrap"
    src="resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m,sap.f"
    data-sap-ui-compat-version="edge"
    data-sap-ui-async="true"
    data-sap-ui-frame-options="trusted"
  ></script>
</head>
<body class="sapUiBody sapUiSizeCompact">
  <!-- login-page.js đặt SAPUI5 form vào host này; breakpoint submit nằm trong submitLogin(). -->
  <div id="loginContent"></div>
  <script src="login-page.js"></script>
</body>
</html>
