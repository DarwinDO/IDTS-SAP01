<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Issue and Defect Tracking System</title>
    <link rel="stylesheet" href="css/idts-shell.css">
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>

    <!-- Resolve custom bearer auth or AppRouter/XSUAA before UI5 sends OData requests. -->
    <script src="auth-guard.js"></script>
    <script src="bootstrap-ui5.js"></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div id="idtsAuthError" role="alert" hidden></div>
    <div id="idtsProfileShellHost"></div>
    <div
        data-sap-ui-component
        data-name="idts.bugmanagementui"
        data-id="container"
        data-settings='{"id" : "idts.bugmanagementui"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
