<!-- Entry point Fiori: browser chạy auth-guard trước; chỉ khi có session mới bootstrap Component/manifest/OData. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Issue and Defect Tracking System</title>
    <link rel="stylesheet" href="css/idts-shell.css">
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>

    <!--
        IDTS-35 auth-guard.js must load SYNCHRONOUSLY and BEFORE the UI5
        bootstrap so the XHR interceptor is active before the first
        OData $metadata request fires.
        CSP note: external src="" script – not inline – satisfies enterprise CSP.
    -->
    <!-- Breakpoint auth đầu tiên: file này redirect login hoặc gắn Bearer token cho mọi OData XHR. -->
    <script src="auth-guard.js"></script>

    <!-- UI5 bootstrap đọc resource root, tạo Component.js rồi manifest.json quyết định page/service. -->
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "idts.bugmanagementui": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <!-- ProfileShell.js đặt avatar/menu vào host riêng, không chạm DOM generated của Fiori Elements. -->
    <div id="idtsProfileShellHost"></div>
    <!-- ComponentSupport đặt Fiori Elements app vào container này. -->
    <div
        data-sap-ui-component
        data-name="idts.bugmanagementui"
        data-id="container"
        data-settings='{"id" : "idts.bugmanagementui"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
