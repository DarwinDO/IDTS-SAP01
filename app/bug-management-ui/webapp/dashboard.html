<!-- Trang bootstrap dashboard: auth-guard phải chạy trước UI5 để request OData đầu tiên đã có Bearer token. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Dashboard - Issue and Defect Tracking System</title>
    <link rel="stylesheet" href="css/idts-shell.css">
    <style>
        html, body, #dashboardContent {
            height: 100%;
        }
    </style>

    <script src="auth-guard.js"></script>

    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "idts.bugmanagementui": "./"
        }'
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
    <script src="dashboard-page.js"></script>
</head>
<body class="sapUiBody sapUiSizeCompact">
    <div id="idtsProfileShellHost"></div>
    <div id="dashboardContent"></div>
</body>
</html>
