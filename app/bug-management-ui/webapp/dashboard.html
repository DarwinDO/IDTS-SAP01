<!-- Entry point dashboard: auth-guard bảo vệ session, dashboard-page.js tự đọc OData và dựng model theo role. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Dashboard - Issue and Defect Tracking System</title>
    <link rel="stylesheet" href="css/idts-shell.css">
    <style>
        html, body, #dashboardContent {
            height: 100%;
        }
    </style>

    <!-- Nếu token thiếu, script này redirect trước khi UI5/dashboard gọi API. -->
    <script src="auth-guard.js"></script>

    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "idts.bugmanagementui": "./"
        }'
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
    <!-- Sau UI5 bootstrap, module này gọi Bugs + DeveloperWorkloads và placeAt dashboardContent. -->
    <script src="dashboard-page.js"></script>
</head>
<body class="sapUiBody sapUiSizeCompact">
    <!-- Hai host tách biệt: một cho profile shell, một cho dashboard page. -->
    <div id="idtsProfileShellHost"></div>
    <div id="dashboardContent"></div>
</body>
</html>
