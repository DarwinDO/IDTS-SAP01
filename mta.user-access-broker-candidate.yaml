_schema-version: '3.3'
ID: idts-user-access-broker-candidate
version: 0.1.0
description: IDTS User Access Broker PRE-MUTATION CANDIDATE / NOT DEPLOYMENT-AUTHORIZED

modules:
  - name: idts-user-access-broker
    type: nodejs
    path: broker
    parameters:
      instances: 1
      no-route: true
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 256M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      IDTS_ACCESS_BROKER_ENABLED: false
      IDTS_ACCESS_BROKER_POLL_INTERVAL_MS: 5000
    build-parameters:
      builder: npm-ci
    requires:
      - name: idts-user-access-broker-auth
      - name: idts-user-access-broker-api-access

resources:
  - name: idts-user-access-broker-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      config:
        xsappname: idts-user-access-broker
        tenant-mode: dedicated
        authorities:
          - $XSSERVICENAME(idts-sap01-auth).ProvisioningBroker
        oauth2-configuration:
          credential-types:
            - binding-secret

  # A later exact mutation gate must create this broker-only UPS without
  # printing, persisting, or exposing its credential values.
  - name: idts-user-access-broker-api-access
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: idts-user-access-broker-api-access
